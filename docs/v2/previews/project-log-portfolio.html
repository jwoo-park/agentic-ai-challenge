&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,

    Object.assign(

   * @param {string} property

  const getPrototypeGetter = (prototype, property) =&gt; {

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

    return Promise.resolve();

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      typeof parsedState !== &quot;object&quot; ||

  const connectorGlobals = {};

    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,

    };

      onData(name, callback) {

        }

        return () =&gt; {};

  }

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    { capture: true },

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

  syncTheme();

    function renderMaterials(project) {

      const wasOpen = new Map(Array.from(container.children, group =&gt; [group.dataset.type, group.open]));
      const removed = state.deletedFiles[state.project] ?? [];
      const groups = new Map(materialTypes.map(type =&gt; [type.id, []]));
      for (const file of [...project.log, ...(project.files ?? [])]) {
        if (removed.includes(file.file)) continue;
        const extension = /\.([^.]+)$/.exec(file.file)?.[1].toLowerCase();
        const type = materialTypes.find(candidate =&gt; candidate.extensions.includes(extension));
        groups.get(type?.id ?? &quot;other&quot;).push(file);
      }
      container.replaceChildren();
      for (const { id, label } of materialTypes) {
        const files = groups.get(id);
        if (!files.length) continue;
        const group = document.createElement(&quot;details&quot;);
        group.className = &quot;material-group&quot;;
        group.dataset.type = id;
        group.open = wasOpen.get(id) ?? !container.childElementCount;
        const summary = document.createElement(&quot;summary&quot;);
        const chevron = document.createElement(&quot;span&quot;);
        chevron.className = &quot;group-chevron&quot;;
        chevron.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        chevron.textContent = &quot;›&quot;;
        const title = document.createElement(&quot;span&quot;);
        title.textContent = label;
        const count = document.createElement(&quot;span&quot;);
        count.className = &quot;group-count&quot;;
        count.textContent = files.length + &quot;개&quot;;
        summary.append(chevron, title, count);
        const list = document.createElement(&quot;ul&quot;);
        files.sort((first, second) =&gt; first.date.localeCompare(second.date));
        for (const file of files) {
          const row = document.createElement(&quot;li&quot;);
          const time = document.createElement(&quot;time&quot;);
          const name = document.createElement(&quot;span&quot;);
          setDate(time, file.date);
          name.textContent = file.file;
          row.append(time, name);
          if (file.duplicateOf) {
            const review = action(&quot;삭제 제안 보기&quot;, &quot;review-cleanup&quot;, &quot;quiet&quot;);
            review.dataset.file = file.file;
            row.append(review);
          }
          list.append(row);
        }
        group.append(summary, list);
        container.append(group);
      }
    }

    function reviewCleanup(fileName) {
      const candidate = projects[state.project].files?.find(file =&gt; file.file === fileName &amp;&amp; file.duplicateOf);
      if (!candidate) return;
      pendingCleanup = { project: state.project, file: candidate.file };
      put(cleanupDialog, &quot;duplicate&quot;, candidate.file);
      put(cleanupDialog, &quot;reason&quot;, &quot;파일 내용이 &quot; + candidate.duplicateOf + &quot;와 같아요. 프로젝트 폴더의 중복 복사본만 삭제합니다.&quot;);
      cleanupDialog.showModal();
    }

    function deleteCopy() {
      if (!pendingCleanup || !cleanupDialog.open) return;
      const { project, file } = pendingCleanup;
      state.deletedFiles[project] = [...(state.deletedFiles[project] ?? []), file];
      cleanupDialog.close();
      if (state.project === project &amp;&amp; state.view === &quot;log&quot;) {
        renderMaterials(projects[project]);
        put(screen, &quot;cleanup-status&quot;, &quot;프로젝트 폴더에서 중복 복사본을 삭제했어요.&quot;);
        root.querySelector(&quot;[data-view=log]&quot;).focus({ preventScroll: true });
      }
      save();
    }

    function toMarkdown(project, value) {
      if (typeof value === &quot;string&quot;) return value;
      const sections = fields
        .filter(field =&gt; value[field.id]?.trim())
        .map(field =&gt; &quot;## &quot; + field.label + &quot;\n&quot; + value[field.id]);
      return [&quot;# &quot; + project.title, ...sections].join(&quot;\n\n&quot;);
    }

    function currentDraft(project) {
      return toMarkdown(project, state.drafts[state.project] ?? project.draft);
    }

    function renderEditor(project) {
      useTemplate(&quot;editor&quot;);
      put(screen, &quot;title&quot;, project.title);
      screen.querySelector(&quot;[data-action=approved]&quot;).hidden = !state.approved[state.project];
      screen.querySelector(&quot;[data-draft]&quot;).value = currentDraft(project);
    }

    function appendMarkdownText(element, text) {
      const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
      for (const part of parts) {
        if (part.startsWith(&quot;**&quot;) &amp;&amp; part.endsWith(&quot;**&quot;) &amp;&amp; part.length &gt; 4) {
          const strong = document.createElement(&quot;strong&quot;);
          strong.textContent = part.slice(2, -2);
          element.append(strong);
        } else if (part.startsWith(&quot;`&quot;) &amp;&amp; part.endsWith(&quot;`&quot;) &amp;&amp; part.length &gt; 2) {
          const code = document.createElement(&quot;code&quot;);
          code.textContent = part.slice(1, -1);
          element.append(code);
        } else {
          element.append(part);
        }
      }
    }

    function renderMarkdown(container, documentText) {
      let list = null;
      let paragraph = [];
      function flushParagraph() {
        if (!paragraph.length) return;
        const element = document.createElement(&quot;p&quot;);
        appendMarkdownText(element, paragraph.join(&quot; &quot;));
        container.append(element);
        paragraph = [];
      }
      for (const line of documentText.split(/\r?\n/)) {
        const heading = /^(#{1,6})\s+(.+)$/.exec(line);
        const bullet = /^(?:([-*])|(\d+)\.)\s+(.+)$/.exec(line);
        if (heading) {
          flushParagraph();
          list = null;
          const element = document.createElement(&quot;h&quot; + heading[1].length);
          appendMarkdownText(element, heading[2]);
          container.append(element);
        } else if (bullet) {
          flushParagraph();
          const type = bullet[1] ? &quot;ul&quot; : &quot;ol&quot;;
          if (list?.localName !== type) {
            list = document.createElement(type);
            if (bullet[2]) list.start = Number(bullet[2]);
            container.append(list);
          }
          const element = document.createElement(&quot;li&quot;);
          appendMarkdownText(element, bullet[3]);
          list.append(element);
        } else {
          list = null;
          if (line.trim()) paragraph.push(line.trim());
          else flushParagraph();
        }
      }
      flushParagraph();
    }

    function renderPreview(project, showApproved) {
      useTemplate(&quot;preview&quot;);
      put(screen, &quot;preview-label&quot;, showApproved ? &quot;확정된 공개본&quot; : &quot;공개본 미리보기&quot;);
      const draft = showApproved ? toMarkdown(project, state.approved[state.project]) : currentDraft(project);
      renderMarkdown(screen.querySelector(&quot;[data-document]&quot;), draft);
      const actions = screen.querySelector(&quot;[data-preview-actions]&quot;);
      actions.hidden = showApproved || !draft.trim();
    }

    function render(mode = &quot;edit&quot;) {
      const project = projects[state.project];
      const isComplete = Boolean(state.completed[state.project]);
      picker.value = state.project;
      status.textContent = isComplete ? &quot;완료&quot; : &quot;진행 중&quot;;
      status.toggleAttribute(&quot;data-emphasis&quot;, isComplete);
      for (const button of navigation) {
        button.hidden = button.dataset.view === &quot;portfolio&quot; &amp;&amp; !isComplete;
        button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.view === state.view));
        if (button.dataset.view === state.view) screen.setAttribute(&quot;aria-label&quot;, button.textContent);
      }
      if (state.view === &quot;log&quot;) renderLog(project);
      else if (state.view !== &quot;portfolio&quot; || !isComplete) renderOverview(project, isComplete);
      else if (mode === &quot;edit&quot;) renderEditor(project);
      else renderPreview(project, mode === &quot;approved&quot;);
    }

    function switchView(view) {
      state.view = view;
      render();
      save();
    }

    picker.addEventListener(&quot;change&quot;, () =&gt; {
      state.project = picker.value;
      switchView(&quot;overview&quot;);
    });
    root.addEventListener(&quot;input&quot;, event =&gt; {
      if (!event.target.hasAttribute(&quot;data-draft&quot;)) return;
      state.drafts[state.project] = event.target.value;
      save();
    });
    cleanupDialog.addEventListener(&quot;close&quot;, () =&gt; { pendingCleanup = null; });
    root.addEventListener(&quot;click&quot;, event =&gt; {
      const button = event.target.closest(&quot;button&quot;);
      if (!button) return;
      if (button.dataset.view) {
        switchView(button.dataset.view);
        return;
      }
      switch (button.dataset.action) {
        case &quot;complete&quot;:
          state.completed[state.project] = true;
          switchView(&quot;overview&quot;);
          screen.querySelector(&quot;[data-action=edit]&quot;).focus();
          break;
        case &quot;edit&quot;:
          switchView(&quot;portfolio&quot;);
          screen.querySelector(&quot;textarea&quot;).focus();
          break;
        case &quot;review-cleanup&quot;:
          reviewCleanup(button.dataset.file);
          break;
        case &quot;cancel-cleanup&quot;:
          cleanupDialog.close();
          break;
        case &quot;delete-copy&quot;:
          deleteCopy();
          break;
        case &quot;preview&quot;:
        case &quot;approved&quot;:
          render(button.dataset.action);
          screen.querySelector(&quot;[data-action=edit]&quot;).focus();
          break;
        case &quot;approve&quot;:
          state.approved[state.project] = currentDraft(projects[state.project]);
          render(&quot;approved&quot;);
          screen.querySelector(&quot;[data-action=edit]&quot;).focus();
          save();
          break;
      }
    });

    restore(window.openai?.widgetState);
    render();
    window.addEventListener(&quot;openai:set_globals&quot;, event =&gt; {
      const saved = event.detail?.globals?.widgetState;
      if (!saved?.privateContent || JSON.stringify(saved.privateContent) === JSON.stringify(state)) return;
      restore(saved);
      render();
    });
  })();

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      .catch(() =&gt; {

    if (!trigger.isConnected || content.length === 0) {

    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {

    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {

    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {

  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }

      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }

  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

  (() =&gt; {

      const panels = Array.from(
        root.querySelectorAll(&quot;:scope &gt; [data-variant]&quot;),

    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
